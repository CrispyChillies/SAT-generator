<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAT Flow Demo</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a1f;
      --border: #2d2d35;
      --text: #e8e6e3;
      --muted: #9b9996;
      --accent: #7c9cff;
      --accent-hover: #9bb2ff;
      --success: #6bcb7d;
      --error: #e57373;
      --warning: #f4a261;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .form-row label {
      font-weight: 500;
      white-space: nowrap;
    }

    input[type="text"],
    input[type="number"],
    select {
      padding: 0.6rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }

    input[type="text"] {
      width: 300px;
    }

    input[type="number"] {
      width: 80px;
    }

    select {
      min-width: 170px;
    }

    .switch-row {
      display: flex;
      gap: 0.9rem;
      align-items: center;
      flex-wrap: wrap;
      margin: -0.4rem 0 1.2rem 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .switch-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }

    .mode-chip {
      display: inline-block;
      margin-top: 0.35rem;
      font-size: 0.78rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.14rem 0.52rem;
    }

    input::placeholder {
      color: var(--muted);
    }

    button {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: none;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s, filter 0.15s;
    }

    .btn-load {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-load:hover {
      background: var(--accent-hover);
    }

    .btn-flow {
      background: var(--surface);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-flow:hover {
      background: rgba(124, 156, 255, 0.12);
    }

    .btn-flow:disabled,
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-save {
      background: var(--success);
      color: var(--bg);
    }

    .btn-save:hover {
      filter: brightness(1.1);
    }

    /* ── Progress bar ── */
    #batchProgress {
      margin-bottom: 1.5rem;
      display: none;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .progress-track {
      height: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .progress-status {
      margin-top: 0.4rem;
      font-size: 0.85rem;
      color: var(--muted);
      font-family: ui-monospace, monospace;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 0.75rem 0;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card .content {
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .card .content p {
      margin: 0.5rem 0;
    }

    .card .content math,
    .card .content .math {
      font-style: italic;
    }

    .card .content figure {
      margin: 1rem 0;
      text-align: center;
    }

    .card .content svg {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .card .content .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    /* Generated question cards in batch */
    .gen-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gen-card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .gen-badge {
      background: var(--accent);
      color: var(--bg);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .gen-badge.error {
      background: var(--error);
    }

    .gen-card h3 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    .choices-list {
      list-style: none;
      padding-left: 0;
    }

    .choice-item {
      margin: 0.4rem 0;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .choice-correct {
      background: rgba(107, 203, 125, 0.15);
      border: 1px solid var(--success);
    }

    .choice-normal {
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .answer-box {
      margin-top: 0.75rem;
      padding: 0.75rem 1rem;
      background: rgba(107, 203, 125, 0.12);
      border: 1px solid var(--success);
      border-radius: 8px;
      color: var(--success);
      font-size: 0.9rem;
    }

    .steps details {
      margin-top: 0.75rem;
      font-size: 0.88rem;
    }

    .steps summary {
      cursor: pointer;
      color: var(--muted);
    }

    .step-item {
      margin: 0.4rem 0;
      padding: 0.4rem 0.6rem;
      background: var(--bg);
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: 0.82rem;
    }

    .gen-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .loading {
      color: var(--muted);
    }

    .error {
      color: var(--error);
    }

    .success {
      color: var(--success);
    }

    .muted {
      color: var(--muted);
    }

    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>SAT Flow Demo</h1>

    <!-- ── Input row ── -->
    <div class="form-row">
      <label for="questionId">Question ID</label>
      <input type="text" id="questionId" placeholder="vd: 06868720-2332-4e01-b188-4f2342bc60a9" />
      <label for="genCount">Count</label>
      <input type="number" id="genCount" value="1" min="1" max="20" title="Số câu hỏi cần tạo" />
      <label for="modelName">Model</label>
      <select id="modelName" title="Model dùng cho OpenAI mode">
        <option value="gpt-4o-mini" selected>gpt-4o-mini</option>
        <option value="gpt-5-mini">gpt-5-mini</option>
        <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        <option value="gpt-4.1">gpt-4.1</option>
      </select>
      <button type="button" class="btn-load" id="btnLoad">Xem câu gốc</button>
      <button type="button" class="btn-flow" id="btnFlow" disabled>Chạy flow</button>
    </div>

    <div class="switch-row">
      <label class="switch-item" title="Bật OpenAI basic cho cả solver và generator">
        <input type="checkbox" id="toggleOpenAIBasic" />
        <span>OpenAI basic (both)</span>
      </label>
      <label class="switch-item" title="Chỉ bật OpenAI basic solver">
        <input type="checkbox" id="toggleOpenAIBasicSolver" />
        <span>OpenAI basic solver</span>
      </label>
      <label class="switch-item" title="Chỉ bật OpenAI basic generator">
        <input type="checkbox" id="toggleOpenAIBasicGenerator" />
        <span>OpenAI basic generator</span>
      </label>
      <label class="switch-item" title="Creative mode (tạo scenario mới)">
        <input type="checkbox" id="toggleCreativeMode" />
        <span>Creative mode</span>
      </label>
    </div>

    <!-- ── Original question ── -->
    <div class="card" id="originalCard">
      <h2>Câu gốc (từ questions_practice_test.json)</h2>
      <div id="originalContent">
        <span class="loading">Nhập ID và bấm "Xem câu gốc".</span>
      </div>
    </div>

    <!-- ── Progress bar ── -->
    <div id="batchProgress">
      <div class="progress-label">
        <span id="progressText">Đang chạy batch…</span>
        <span id="progressCount">0 / 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-status" id="progressStatus"></div>
    </div>

    <!-- ── Generated question cards ── -->
    <div id="generatedCards"></div>
  </div>

  <script>
    const questionIdEl = document.getElementById("questionId");
    const genCountEl = document.getElementById("genCount");
    const modelNameEl = document.getElementById("modelName");
    const btnLoad = document.getElementById("btnLoad");
    const btnFlow = document.getElementById("btnFlow");
    const originalContent = document.getElementById("originalContent");
    const toggleOpenAIBasic = document.getElementById("toggleOpenAIBasic");
    const toggleOpenAIBasicSolver = document.getElementById("toggleOpenAIBasicSolver");
    const toggleOpenAIBasicGenerator = document.getElementById("toggleOpenAIBasicGenerator");
    const toggleCreativeMode = document.getElementById("toggleCreativeMode");

    // Progress
    const batchProgress = document.getElementById("batchProgress");
    const progressText = document.getElementById("progressText");
    const progressCount = document.getElementById("progressCount");
    const progressFill = document.getElementById("progressFill");
    const progressStatus = document.getElementById("progressStatus");

    const generatedCards = document.getElementById("generatedCards");

    let currentQuestionId = null;

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function setProgress(done, total) {
      const pct = total > 0 ? (done / total) * 100 : 0;
      progressFill.style.width = pct + "%";
      progressCount.textContent = `${done} / ${total}`;
    }

    function getModePayload() {
      return {
        model: (modelNameEl.value || "gpt-4o-mini").trim(),
        use_openai_basic: !!toggleOpenAIBasic.checked,
        use_openai_basic_solver: !!toggleOpenAIBasicSolver.checked,
        use_openai_basic_generator: !!toggleOpenAIBasicGenerator.checked,
        creative_mode: !!toggleCreativeMode.checked,
      };
    }

    function formatMode(mode) {
      if (!mode) return "mode: default";
      const tags = [];
      if (mode.use_openai_basic_solver) tags.push("oa-basic-solver");
      if (mode.use_openai_basic_generator) tags.push("oa-basic-generator");
      if (mode.creative_mode) tags.push("creative");
      if (!tags.length) tags.push("default");
      if (mode.model) tags.push(mode.model);
      return `mode: ${tags.join(" | ")}`;
    }

    // ── Load original question ──
    btnLoad.addEventListener("click", async () => {
      const id = questionIdEl.value.trim();
      if (!id) {
        originalContent.innerHTML = '<span class="error">Vui lòng nhập Question ID.</span>';
        return;
      }
      originalContent.innerHTML = '<span class="loading">Đang tải...</span>';
      try {
        const r = await fetch("/api/question/" + encodeURIComponent(id));
        const data = await r.json();
        if (!r.ok) {
          originalContent.innerHTML = `<span class="error">${data.error || "Lỗi " + r.status}</span>`;
          btnFlow.disabled = true;
          return;
        }
        currentQuestionId = data.id;
        btnFlow.disabled = false;

        let html = "";
        if (data.category || data.difficulty)
          html += `<div class="meta">${[data.category, data.difficulty].filter(Boolean).join(" · ")}</div>`;
        if (data.paragraph_html)
          html += `<div class="content" style="margin-bottom:1em;color:var(--muted)">${data.paragraph_html}</div>`;
        html += `<strong>Câu hỏi</strong><div class="content">${data.question_html || "—"}</div>`;
        if (data.choices && data.choices.length) {
          html += `<p><strong>Đáp án đúng</strong> (${data.correct_answer_letter || ""}):</p>`;
          html += `<div class="content">${data.correct_answer_html || "—"}</div>`;
        } else {
          html += `<p><strong>Đáp án đúng</strong>: <span class="content">${data.correct_answer_html || "—"}</span></p>`;
        }
        html += `<p><strong>Explanation</strong></p><div class="content">${data.explanation_html || "—"}</div>`;
        originalContent.innerHTML = html;
      } catch (e) {
        originalContent.innerHTML = `<span class="error">Lỗi: ${e.message}</span>`;
        btnFlow.disabled = true;
      }
    });

    // ── Run batch flow ──
    btnFlow.addEventListener("click", async () => {
      const id = currentQuestionId || questionIdEl.value.trim();
      const count = Math.max(1, parseInt(genCountEl.value) || 1);
      if (!id) return;

      // Reset UI
      generatedCards.innerHTML = "";
      batchProgress.style.display = "block";
      progressText.textContent = `Đang tạo ${count} câu hỏi…`;
      progressStatus.textContent = "";
      setProgress(0, count);
      btnFlow.disabled = true;

      try {
        const resp = await fetch("/api/run-flow-batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question_id: id,
            count,
            ...getModePayload(),
          }),
        });

        if (!resp.ok) {
          const err = await resp.json();
          progressStatus.textContent = "Lỗi: " + (err.error || resp.status);
          btnFlow.disabled = false;
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          // Parse SSE lines
          const lines = buffer.split("\n\n");
          buffer = lines.pop(); // keep incomplete chunk

          for (const block of lines) {
            const dataLine = block.split("\n").find(l => l.startsWith("data:"));
            if (!dataLine) continue;
            let payload;
            try { payload = JSON.parse(dataLine.slice(5).trim()); }
            catch { continue; }

            if (payload.done) {
              progressText.textContent = "✓ Hoàn tất!";
              progressStatus.textContent = "";
              btnFlow.disabled = false;
              break;
            }

            const { index, total } = payload;
            setProgress(index + 1, total);
            progressStatus.textContent = `[${"█".repeat(Math.round(28 * (index + 1) / total))}${"░".repeat(28 - Math.round(28 * (index + 1) / total))}] ${index + 1}/${total}`;

            // Append card immediately
            appendQuestionCard(payload, index, total);
          }
        }
      } catch (e) {
        progressStatus.textContent = "Lỗi kết nối: " + e.message;
        btnFlow.disabled = false;
      }
    });

    function appendQuestionCard(data, index, total) {
      const card = document.createElement("div");
      card.className = "gen-card";

      const hasError = !!data.error;
      const badgeClass = hasError ? "gen-badge error" : "gen-badge";
      const badgeText = hasError ? `#${index + 1} ✗` : `#${index + 1} ✓`;

      let html = `
        <div class="gen-card-header">
          <span class="${badgeClass}">${badgeText}</span>
          <h3>Câu hỏi mới ${index + 1} / ${total}</h3>
        </div>`;

      html += `<div class="mode-chip">${escapeHtml(formatMode(data.mode))}</div>`;

      if (hasError) {
        html += `<p class="error">Lỗi: ${escapeHtml(data.error)}</p>`;
        card.innerHTML = html;
        generatedCards.appendChild(card);
        return;
      }

      // Paragraph
      if (data.new_paragraph_html) {
        html += `<p><strong>Paragraph</strong></p>
          <div class="content" style="margin-bottom:1em;padding:1rem;background:var(--bg);border-radius:8px;border:1px solid var(--border)">
            ${data.new_paragraph_html}
          </div>`;
      }

      // Question
      html += `<p><strong>Câu hỏi</strong></p>
        <div class="content">${data.new_question_text || "—"}</div>`;

      // Choices
      const letters = ["A", "B", "C", "D"];
      if (data.new_choices_html && data.new_choices_html.length === 4) {
        const correctLetter = (data.new_correct_answer_letter || "").toUpperCase();
        html += `<p><strong>Đáp án</strong></p><ul class="choices-list">`;
        data.new_choices_html.forEach((ch, i) => {
          const isCorrect = letters[i] === correctLetter;
          html += `<li class="choice-item ${isCorrect ? "choice-correct" : "choice-normal"}">
            <strong>${letters[i]}${isCorrect ? " ✓" : ""}.</strong>
            <span class="content">${ch}</span>
          </li>`;
        });
        html += `</ul>`;
      } else if (data.new_correct_answer_html) {
        html += `<p><strong>Đáp án</strong></p><div class="content">${data.new_correct_answer_html}</div>`;
      }

      // Explanation
      if (data.new_explanation_html) {
        html += `<p><strong>Explanation</strong></p>
          <div class="content">${data.new_explanation_html}</div>`;
      }

      // Step B trace (solver trace from phase B)
      const stepB = data.step_b_trace;
      if (stepB && Array.isArray(stepB.steps) && stepB.steps.length) {
        html += `<div class="steps"><details><summary>Step B Trace (${stepB.steps.length})</summary>`;
        if (stepB.final_result != null) {
          html += `<div class="step-item"><strong>Final (B):</strong> ${escapeHtml(String(stepB.final_result))}</div>`;
        }
        stepB.steps.forEach((s, i) => {
          const stepNo = s.step_number || (i + 1);
          const tool = s.tool_name ? ` · ${s.tool_name}` : "";
          const out = s.tool_output != null ? ` → ${escapeHtml(String(s.tool_output))}` : "";
          html += `<div class="step-item">B.${stepNo}${tool}${out}</div>`;
          if (s.thought) {
            html += `<div class="step-item" style="white-space: pre-wrap; line-height: 1.4;">${escapeHtml(String(s.thought))}</div>`;
          }
        });
        html += `</details></div>`;
      }

      // Answer result from solver
      const ar = data.answer_result;
      if (ar) {
        if (ar.final_result != null)
          html += `<div class="answer-box"><strong>Đáp án solver</strong>: ${escapeHtml(String(ar.final_result))}</div>`;
        if (ar.steps_detail && ar.steps_detail.length) {
          html += `<div class="steps"><details><summary>Steps (${ar.steps_detail.length})</summary>`;
          ar.steps_detail.forEach((s, i) => {
            html += `<div class="step-item">Step ${s.step_number || i + 1}`;
            if (s.tool_name) html += ` · ${s.tool_name}`;
            if (s.tool_output != null) html += ` → ${escapeHtml(String(s.tool_output))}`;
            html += `</div>`;
          });
          html += `</details></div>`;
        }
        if (ar.error) html += `<p class="error">${escapeHtml(ar.error)}</p>`;
      }

      // Match badge
      if (data.answers_match === true) {
        html += `<p><span class="success">✓ Đáp án C và D khớp nhau</span></p>`;
      } else if (data.answers_match === false) {
        html += `<p><span class="muted">✗ Đáp án C và D chưa khớp</span></p>`;
      }

      card.innerHTML = html;

      // Save button
      const actions = document.createElement("div");
      actions.className = "gen-actions";
      if (data.answers_match === true && data.new_question_item) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn-save";
        btn.id = `btnSave_${index}`;
        btn.textContent = "Save sample";
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          btn.textContent = "Đang lưu…";
          try {
            const r = await fetch("/api/save-question", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ new_question_item: data.new_question_item }),
            });
            const res = await r.json();
            if (r.ok && res.ok) {
              actions.innerHTML = `<span class="success">Đã lưu: ${escapeHtml(res.filename || "OK")}</span>`;
            } else {
              actions.innerHTML = `<span class="error">Lỗi: ${escapeHtml(res.error || r.status)}</span>`;
            }
          } catch (e) {
            actions.innerHTML = `<span class="error">Lỗi: ${escapeHtml(e.message)}</span>`;
          }
        });
        actions.appendChild(btn);
      }
      card.appendChild(actions);
      generatedCards.appendChild(card);
      card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  </script>
</body>

</html>
